<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bloom — módulo estudante, front-end demonstrativo do TCC">
<title>Bloom — Estudante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3eb;--paper:#fffdf8;--paper2:#fbf7f0;--ink:#294239;--muted:#718078;--sage:#7d9a88;--sage-soft:#e6eee8;--sage-deep:#496b58;--peach:#efc3ad;--peach-soft:#fae9df;--terracotta:#b86f58;--line:#e7e0d5;--danger:#b75e58;--shadow:0 15px 38px rgba(55,70,60,.08);--radius:22px}
:root[data-theme=dark]{--bg:#1e2923;--paper:#29362f;--paper2:#24312b;--ink:#eef4ef;--muted:#aab8af;--sage:#8ca999;--sage-soft:#31443a;--sage-deep:#9fc0ac;--peach:#70483b;--peach-soft:#45322d;--terracotta:#d18870;--line:#3d4b43;--shadow:0 15px 38px rgba(0,0,0,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.45}button,input,textarea,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.muted,.sub{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:900;color:var(--terracotta)}
.nav{position:sticky;top:0;z-index:50;height:76px;background:rgba(255,253,248,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);display:flex;align-items:center;padding:0 4.5%;gap:30px}.logo{font:700 31px Fraunces,serif;color:var(--sage-deep);letter-spacing:-.02em}.logo span{color:var(--terracotta)}.nav-links{display:flex;gap:5px;flex:1}.nav-links a{padding:11px 14px;border-radius:12px;color:var(--muted);font-weight:800;font-size:14px}.nav-links a:hover,.nav-links a.active{background:var(--sage-soft);color:var(--sage-deep)}.nav-right{display:flex;gap:10px;align-items:center}.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:12px;color:var(--sage-deep);position:relative}.icon-btn:hover{background:var(--sage-soft)}.notify-dot{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--terracotta)}.profile-btn{display:flex;align-items:center;gap:8px;background:var(--paper2);border:1px solid var(--line);padding:4px 10px 4px 4px;border-radius:999px;color:var(--ink);font-weight:900}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d7e3d9;color:var(--sage-deep);font-weight:900}
.container{max-width:1240px;margin:0 auto;padding:40px 26px 70px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:22px;margin-bottom:28px}.page-head h1{font:600 43px/1.05 Fraunces,serif;margin:8px 0 7px;letter-spacing:-.02em}.page-head p{margin:0;font-size:16px}.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}.card.soft{background:var(--sage-soft)}.card.peach{background:var(--peach-soft)}.card h2,.card h3{font-family:Fraunces,serif;color:var(--ink)}.card h2{font-size:25px;margin:0}.card h3{font-size:20px;margin:0}.card-title{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.big-icon{font-size:26px}.btn{border:0;border-radius:13px;padding:11px 17px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.16s}.btn.primary{background:var(--sage-deep);color:#fff}.btn.secondary{background:var(--paper2);color:var(--sage-deep);border:1px solid var(--line)}.btn.danger{background:#f3dedb;color:#8d4a46}.btn.ghost{background:transparent;color:var(--sage-deep);padding:6px}.btn:hover{transform:translateY(-1px)}
.grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.grid-2-eq{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.tab{border:1px solid var(--line);background:var(--paper2);color:var(--muted);padding:9px 14px;border-radius:11px;font-weight:900}.tab.active{background:var(--sage-soft);border-color:#ccd9cf;color:var(--sage-deep)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.mood{border:1px solid var(--line);background:var(--paper2);border-radius:16px;padding:14px 8px;text-align:center;color:var(--muted);font-weight:800}.mood:hover,.mood.selected{border-color:var(--sage);background:var(--sage-soft);color:var(--sage-deep);transform:translateY(-2px)}.mood span{display:block;font-size:27px;margin-bottom:5px}.quote{font:600 25px/1.22 Fraunces,serif;margin:19px 0 23px;max-width:370px}.bloom-card{position:relative;overflow:hidden}.bloom-art{position:absolute;right:18px;bottom:-4px;font-size:76px;opacity:.55}.events{margin-top:11px}.event{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event-time{width:53px;color:var(--terracotta);font-weight:900}.event small{color:var(--muted);display:block}.quick-card{padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--paper2);text-align:left;color:var(--sage-deep);font-weight:900}.quick-card small{display:block;color:var(--muted);font-weight:700;margin-top:3px}.support{background:var(--peach-soft)}
.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.left{display:flex;gap:12px;align-items:center;min-width:0}.mini-icon{width:43px;height:43px;border-radius:13px;background:var(--sage-soft);color:var(--sage-deep);display:grid;place-items:center;font-size:20px;flex:none}.mini-icon.peach{background:var(--peach-soft);color:var(--terracotta)}.row-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--sage-soft);color:var(--sage-deep);font-size:12px;font-weight:900}.tag.peach{background:var(--peach-soft);color:var(--terracotta)}.tag.red{background:#f3dedb;color:#8f4b47}.tag.gray{background:#eeebe4;color:#766f63}.stat{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--paper2)}.stat .n{font:700 30px Fraunces,serif}.stat .label{font-size:13px;color:var(--muted);font-weight:900}.stat .trend{font-size:12px;color:var(--sage-deep);font-weight:900;margin-top:4px}.progress{height:9px;background:#e9e4dc;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--sage);border-radius:999px}.strike{text-decoration:line-through;opacity:.55}.check-btn{width:35px;height:35px;border:1px solid var(--line);background:var(--paper2);border-radius:50%;color:var(--sage-deep);font-weight:900}.check-btn.done{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-deep)}.empty{padding:28px;text-align:center;color:var(--muted)}
.timeline{display:flex;flex-direction:column}.timeline-item{display:grid;grid-template-columns:58px 22px 1fr;gap:10px;padding-bottom:20px}.timeline-item:last-child{padding-bottom:0}.timeline-time{font-size:13px;font-weight:900;color:var(--terracotta)}.timeline-line{position:relative}.timeline-line:before{content:"";width:10px;height:10px;background:var(--sage);border-radius:50%;display:block;margin:4px auto;position:relative;z-index:2}.timeline-line:after{content:"";position:absolute;left:10px;top:14px;bottom:-20px;width:2px;background:#d9e2dc}.timeline-item:last-child .timeline-line:after{display:none}.timeline-content{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:12px}.timeline-content b{display:block}.timeline-content small{color:var(--muted)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:14px;overflow:hidden}.cal-cell{min-height:103px;background:var(--paper);padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cal-week{min-height:42px;background:var(--paper2);font-weight:900;color:var(--muted)}.cal-cell.muted-day{color:#aea79c;background:#fbf8f1}.cal-cell.today{background:var(--sage-soft)}.cal-day{font-size:12px;font-weight:900}.cal-chip{display:block;margin-top:8px;background:var(--sage-soft);color:var(--sage-deep);border-radius:7px;padding:4px;font-size:10px;font-weight:900}.cal-chip.peach{background:var(--peach-soft);color:var(--terracotta)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:900}.field input,.field textarea,.field select{border:1px solid var(--line);background:#fffdf8;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(125,154,136,.14)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:17px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip,.answer{border:1px solid var(--line);background:var(--paper2);color:var(--muted);padding:8px 11px;border-radius:999px;font-weight:800}.chip.on,.answer:hover{background:var(--sage-soft);color:var(--sage-deep);border-color:var(--sage)}.answer-list{display:flex;flex-direction:column;gap:9px}.answer{border-radius:13px;text-align:left}
.pomo{text-align:center;background:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%)}.pomo-ring{width:230px;height:230px;margin:12px auto 15px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sage-deep) 0 72%,#dfe7e0 72% 100%);position:relative}.pomo-ring:after{content:"";position:absolute;width:184px;height:184px;background:var(--paper);border-radius:50%}.pomo-ring .inside{position:relative;z-index:2}.pomo-display,.focus-time{font:600 55px/1 Fraunces,serif;color:var(--sage-deep);margin:7px 0}.settings-inline{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:15px}.chart{height:220px;display:flex;gap:13px;align-items:flex-end;padding:20px 8px 0}.chart.tall{height:290px}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:center}.bar i{display:block;background:var(--sage);border-radius:9px 9px 3px 3px;min-height:8px}.bar small{font-size:11px;color:var(--muted)}.sound-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sound{border:1px solid var(--line);background:var(--paper2);border-radius:16px;padding:15px;text-align:left}.sound.active{background:var(--sage-soft);border-color:var(--sage)}.sound b,.sound small{display:block}.sound small{color:var(--muted);margin-top:3px}.focus-screen{min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--sage-soft)}.focus-screen h2{font-size:42px;margin:10px 0}.focus-tip{margin-top:32px;padding:15px 18px;background:var(--paper);border:1px solid var(--line);border-radius:15px;display:flex;gap:10px;flex-direction:column;max-width:520px}.focus-tip b{color:var(--sage-deep)}
.recommend{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.recommend:last-child{border-bottom:0}.recommend h3{margin:0 0 5px}.breath-orb{width:150px;height:150px;border-radius:50%;background:var(--sage-soft);display:grid;place-items:center;font-size:60px;margin:0 auto 18px;animation:pulse 4s infinite}.breathing-screen{min-height:440px;display:grid;place-items:center;text-align:center}.breathing-screen h2{font-size:36px;margin:8px 0}.service-card{display:flex;gap:13px;align-items:flex-start}.location-strip{margin-top:17px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.support-track{display:flex;gap:4px;margin-top:10px}.support-track span{height:5px;flex:1;background:#ddd9d0;border-radius:99px}.support-track span.done{background:var(--sage)}
.event-card{min-height:220px;display:flex;flex-direction:column;justify-content:space-between}.event-date{width:58px;height:60px;border-radius:15px;background:var(--sage-soft);display:grid;place-items:center;color:var(--sage-deep);font-weight:900;text-align:center}.event-date strong{font:700 21px Fraunces,serif}.post{padding:14px 0;border-bottom:1px solid var(--line)}.post-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.post p{margin:7px 0}.post-actions{display:flex;gap:4px}.footer{padding:0 26px 38px;text-align:center;color:var(--muted);font-size:12px}.modal-backdrop{position:fixed;inset:0;background:rgba(36,54,46,.28);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-backdrop.open{display:flex}.modal{width:min(660px,100%);max-height:88vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.modal-head h2{margin:5px 0 0;font:600 28px Fraunces,serif}.modal-close{border:0;background:transparent;font-size:24px;color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;z-index:120;background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
@keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
@media(max-width:980px){.nav{padding:0 18px;gap:14px}.nav-links{display:none}.container{padding:30px 18px 55px}.page-head{flex-direction:column;align-items:flex-start}.grid-2,.grid-2-eq,.profile-hero{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr 1fr}.grid-4{grid-template-columns:1fr 1fr}.moods{grid-template-columns:repeat(2,1fr)}.sound-grid{grid-template-columns:1fr 1fr}.calendar-grid{grid-template-columns:repeat(7,120px);width:max-content}.calendar-grid{overflow:auto}}
@media(max-width:600px){.profile-btn .name{display:none}.nav{height:68px}.page-head h1{font-size:35px}.grid-3,.grid-4,.form-grid,.sound-grid{grid-template-columns:1fr}.mood-history{grid-template-columns:repeat(4,1fr)}.pomo-ring{width:195px;height:195px}.pomo-ring:after{width:155px;height:155px}.pomo-display{font-size:44px}.focus-screen h2{font-size:34px}}
</style>
</head>
<body>
<header class="nav">
<a class="logo" href="#/">bloom<span>.</span></a>
<nav class="nav-links" id="navLinks"></nav>
<div class="nav-right"><button class="icon-btn" id="notificationButton" aria-label="Notificações">♧<i class="notify-dot"></i></button><button class="profile-btn" id="profileMenu"><span class="avatar">AS</span><span class="name">Ana Silva</span><span>⌄</span></button></div>
</header>
<main id="app"></main>
<footer class="footer">Bloom · protótipo acadêmico do módulo estudante · dados fictícios · funcionamento local</footer>

</html>
