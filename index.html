<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bloom — módulo estudante, front-end demonstrativo do TCC">
  <meta name="theme-color" content="#FBF4E8">
  <title>Bloom — Estudante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="refined.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="#/" aria-label="Bloom — Início">bloom<span>.</span></a>
    <nav class="nav-links" id="navLinks" aria-label="Navegação principal"></nav>
    <div class="nav-right">
      <button class="icon-btn" id="notificationButton" aria-label="Notificações" title="Notificações">
        <span aria-hidden="true">♧</span>
        <i class="notify-dot"></i>
      </button>
      <button class="profile-btn" id="profileMenu" aria-label="Abrir menu de perfil">
        <span class="avatar">AS</span>
        <span class="name">Ana Silva</span>
        <span aria-hidden="true">⌄</span>
      </button>
    </div>
  </header>

  <main id="app"></main>
  <footer class="footer">Bloom · protótipo acadêmico do módulo estudante · dados fictícios e funcionamento local</footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Janela do Bloom"></div>
  </div>

  <script>
    const BLOOM_UI_VERSION='2';
    if(localStorage.getItem('bloom-ui-version')!==BLOOM_UI_VERSION){
      localStorage.removeItem('bloom-data');
      localStorage.setItem('bloom-ui-version',BLOOM_UI_VERSION);
    }
  </script>
  <script src="app.js"></script>
  <script src="enhance.js"></script>
</body>
</html>
